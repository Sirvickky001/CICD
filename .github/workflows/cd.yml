name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: dev

    steps:
      - name: Simulate deploy to dev
        run: |
          echo "✅ CI passed — deploying to dev"
          echo "Image: ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }}"
          echo "kubectl set image deployment/secureshop app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} --namespace=dev"
          echo "Deploy to dev complete"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging

    steps:
      - name: Simulate deploy to staging
        run: |
          echo "✅ Dev passed — deploying to staging"
          echo "Image: ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }}"
          echo "kubectl set image deployment/secureshop app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} --namespace=staging"
          echo "Deploy to staging complete"

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production

    steps:
      - name: Simulate deploy to production
        run: |
          echo "✅ Staging passed — approved for production"
          echo "Image: ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }}"
          echo "kubectl set image deployment/secureshop app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} --namespace=prod"
          echo "Deploy to production complete"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Production deploy succeeded",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Repo", "value": "${{ github.repository }}", "short": true},
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true},
                  {"title": "Commit", "value": "${{ github.event.workflow_run.head_sha }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
