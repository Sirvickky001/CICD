name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]   # only runs after CI passes
    types: [completed]
    branches: [main]

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to dev
        run: |
          kubectl set image deployment/calapp \
            app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} \
            --namespace=dev

      - name: Verify rollout
        run: kubectl rollout status deployment/secureshop --namespace=dev --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/calapp --namespace=dev

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to staging
        run: |
          kubectl set image deployment/calapp \
            app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} \
            --namespace=staging

      - name: Verify rollout
        run: kubectl rollout status deployment/calapp --namespace=staging --timeout=120s

      - name: Rollback on failure
        if: failure()
        run: kubectl rollout undo deployment/calapp --namespace=staging

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production        # ← triggers approval gate

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to production
        run: |
          kubectl set image deployment/calapp \
            app=ghcr.io/sirvickky001/cicd:${{ github.event.workflow_run.head_sha }} \
            --namespace=prod

      - name: Verify rollout
        run: kubectl rollout status deployment/calapp --namespace=prod --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/calapp --namespace=prod
          echo "Production rollback complete"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ Production deploy succeeded' || '❌ Production deploy FAILED — rolled back' }}",
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {"title": "Commit", "value": "${{ github.event.workflow_run.head_sha }}", "short": true},
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
